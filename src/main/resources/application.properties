spring.application.name=MetalApp
server.port = 8082


## MYSQL CONNECTION
spring.datasource.url=jdbc:mysql://localhost:3306/krupalu_dev
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=TRUE
spring.jpa.hibernate.ddl-auto=update

spring.main.allow-circular-references=true

# allow larger file uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

logging.level.com.krupalu.MetalApp=INFO


stripe.secret.key=${secret_key}
stripe.public.key=${public_key}
stripe.price.id=${price_id}
stripe.currency=${currency}

logging.level.org.springframework.security=DEBUG


